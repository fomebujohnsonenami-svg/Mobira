version: '3.9'

services:
  # ============================================================================
  # 1. PostgreSQL Database Service (PostgreSQL from Day One)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: mobira_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobira_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mobira_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mobira_network

  # ============================================================================
  # 2. Django REST Framework Backend Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobira_backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py seed_demo_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-mobira-fintech-prototype-competition-key-2026}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mobira_db}
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - MOCK_PROVIDER_LATENCY_MS=500
      - MAKER_CHECKER_THRESHOLD_XAF=500000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mobira_network

  # ============================================================================
  # 3. Next.js Frontend Service
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mobira_frontend
    restart: unless-stopped
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_APP_NAME=Mobira
      - NEXT_PUBLIC_SIMULATION_MODE=true
    depends_on:
      - backend
    networks:
      - mobira_network

volumes:
  pgdata:
    driver: local

networks:
  mobira_network:
    driver: bridge
